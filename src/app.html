<title>Радар новичков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Раскладка: узкая шапка с вкладками, под ней три группы новичков по уровню риска. Строка = человек, шкала 90 дней с точками встреч. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#16201B; --muted:#56655D; --line:#D9E0DA; --soft:#E9EEE9;
  --accent:#1E6B4B; --accent-ink:#FFFFFF;
  --high:#B3261E; --high-bg:#FBE8E5; --mid:#8A5300; --mid-bg:#FFF0D2; --ok:#2F7A58; --ok-bg:#E3F1E9;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#17201A; --ink:#E7EEE9; --muted:#9AABA1; --line:#2A362E; --soft:#202B24;
  --accent:#5CC593; --accent-ink:#08140D;
  --high:#FF9A90; --high-bg:#3B1B18; --mid:#F2B450; --mid-bg:#38290F; --ok:#6FD0A0; --ok-bg:#16301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#17201A; --ink:#E7EEE9; --muted:#9AABA1; --line:#2A362E; --soft:#202B24;
  --accent:#5CC593; --accent-ink:#08140D;
  --high:#FF9A90; --high-bg:#3B1B18; --mid:#F2B450; --mid-bg:#38290F; --ok:#6FD0A0; --ok-bg:#16301F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{padding:20px 0 0;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--font-display);font-size:22px;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
.tile b{font-family:var(--font-display);font-size:26px;font-weight:500;display:block;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.high b{color:var(--high)} .tile.mid b{color:var(--mid)} .tile.low b{color:var(--ok)}
.tile[aria-pressed="true"]{outline:2px solid var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}

.group{margin-top:22px}
.group>h2{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.high{background:var(--high)} .dot.mid{background:var(--mid)} .dot.low{background:var(--ok)}

.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:14px 18px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600}
.row .who small{color:var(--muted)}
.row .why{min-width:0;font-size:14px}
.row .why .act{font-weight:600;display:block}
.row .why .reason{color:var(--muted)}
.row .go{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.score{font-variant-numeric:tabular-nums;font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.score.high{background:var(--high-bg);color:var(--high)} .score.mid{background:var(--mid-bg);color:var(--mid)} .score.low{background:var(--ok-bg);color:var(--ok)}

.track{position:relative;height:6px;background:var(--soft);border-radius:3px;margin:12px 4px 18px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.35;border-radius:3px}
.track i{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--muted);background:var(--surface)}
.track i.done{background:var(--accent);border-color:var(--accent)}
.track i.late{background:var(--high);border-color:var(--high)}
.track i.due{border-color:var(--mid);background:var(--mid-bg)}
.track em{position:absolute;top:10px;font-style:normal;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.track .now{position:absolute;top:-6px;width:3px;height:18px;margin-left:-1.5px;background:var(--ink);border-radius:2px}

details.fold{margin-top:22px}
details.fold summary{cursor:pointer;color:var(--muted);font-weight:500;padding:6px 0}
.compact{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;align-items:center}
.compact small{color:var(--muted)}

table.t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
table.t th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{color:var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(8,14,10,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:5vh 12px;z-index:20}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{font-size:18px}
.sheet .meta{color:var(--muted);font-size:14px;margin:4px 0 14px}
.sheet h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.cp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.cp:last-child{border-bottom:0}
.cp .d{font-weight:700;min-width:46px}
.cp small{color:var(--muted);display:block}
.pill{border-radius:999px;font-size:12px;padding:2px 9px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok)} .pill.late{background:var(--high-bg);color:var(--high)} .pill.due{background:var(--mid-bg);color:var(--mid)} .pill.wait{background:var(--soft);color:var(--muted)}
.box{background:var(--soft);border-radius:10px;padding:12px 14px}
.box ul{margin:6px 0 0;padding-left:18px}
.close{float:right}
.scale{display:flex;gap:6px;margin:6px 0 14px}
.scale button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q{font-weight:500}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
pre.json{background:var(--soft);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:240px;margin:8px 0 0}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.task header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw;font-size:14px}
footer.note{margin-top:36px;color:var(--muted);font-size:12.5px;display:flex;gap:10px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr}
  .row .go{justify-content:flex-start}
  .compact{grid-template-columns:1fr auto}
  .compact .c3{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Радар новичков</h1>
      <p id="sub"></p>
    </div>
    <div class="tools">
      <button class="btn primary" data-act="add">Добавить новичка</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="view"></main>
  <footer class="note">
    <span>Данные вымышленные. Задачи для Битрикс24 собираются как запрос tasks.task.add и без адреса вебхука остаются в журнале.</span>
    <span>
      <button class="btn small" data-act="day">Показать завтрашний день</button>
      <button class="btn small" data-act="reset">Сбросить демо</button>
    </span>
  </footer>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<!--SCRIPTS-->
